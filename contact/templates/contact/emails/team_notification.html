{% comment %}
Team notification email, sent when a new contact message arrives.

Written with table-based layout and inline styles on purpose: this is what
survives Outlook desktop, Gmail, and most other clients without breaking.
A <style> block alone is not reliable enough for a real inbox.
{% endcomment %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>New contact message</title>
</head>
<body style="margin:0; padding:0; background-color:#f2f2f2; font-family:Arial, Helvetica, sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f2f2f2; padding:24px 0;">
    <tr>
      <td align="center">
        <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="max-width:600px; width:100%; background-color:#ffffff; border-radius:8px; overflow:hidden; box-shadow:0 2px 8px rgba(0,0,0,0.08);">

          <!-- Header -->
          <tr>
            <td style="background-color:#01164F; padding:24px 32px;">
              <span style="color:#ffffff; font-size:20px; font-weight:bold; letter-spacing:0.5px;">MADNI SOLAR</span>
              <div style="color:#ffffff; opacity:0.75; font-size:13px; margin-top:4px;">New Contact Message</div>
            </td>
          </tr>

          <!-- Body -->
          <tr>
            <td style="padding:32px;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
                <tr>
                  <td style="padding:6px 0; color:#01164F; font-size:13px; font-weight:bold; width:90px; vertical-align:top;">Name</td>
                  <td style="padding:6px 0; color:#1a1a1a; font-size:14px;">{{ contact.name }}</td>
                </tr>
                <tr>
                  <td style="padding:6px 0; color:#01164F; font-size:13px; font-weight:bold; vertical-align:top;">Email</td>
                  <td style="padding:6px 0; font-size:14px;">
                    <a href="mailto:{{ contact.email }}" style="color:#14539a; text-decoration:none;">{{ contact.email }}</a>
                  </td>
                </tr>
                <tr>
                  <td style="padding:6px 0; color:#01164F; font-size:13px; font-weight:bold; vertical-align:top;">Phone</td>
                  <td style="padding:6px 0; color:#1a1a1a; font-size:14px;">{{ contact.phone|default:"-" }}</td>
                </tr>
                <tr>
                  <td style="padding:6px 0; color:#01164F; font-size:13px; font-weight:bold; vertical-align:top;">Subject</td>
                  <td style="padding:6px 0; color:#1a1a1a; font-size:14px; font-weight:bold;">{{ contact.subject }}</td>
                </tr>
              </table>

              <!-- Message -->
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin-top:20px;">
                <tr>
                  <td style="background-color:#f2f2f2; border-left:3px solid #e06a10; border-radius:4px; padding:16px; color:#1a1a1a; font-size:14px; line-height:1.6; white-space:pre-wrap;">{{ contact.message }}</td>
                </tr>
              </table>

            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td style="padding:16px 32px; background-color:#f2f2f2; color:#777777; font-size:12px; text-align:center;">
              Automated notification from the Madni Solar contact form. Reply to this email to reach {{ contact.name }} directly.
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
